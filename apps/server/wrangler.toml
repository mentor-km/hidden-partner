name = "hidden-partner"
main = "src/index.ts"
compatibility_date = "2026-11-07"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
upload_source_maps = false

# Public origin for share links and preview images. See DEPLOY.md.
[vars]
PUBLIC_SITE_URL = "https://hidden-partner.connect-f83.workers.dev"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/parties/*"]

[[durable_objects.bindings]]
name = "Room"
class_name = "RoomServer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomServer"]
